<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Obsidian</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&family=Inter:wght@300;600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: radial-gradient(ellipse at top, #0a0a0a 0%, #000000 100%);
      color: #e0e0e0;
      font-family: 'Inter', sans-serif;
      height: 100vh;
      overflow: hidden;
    }

    header {
      padding: 2rem;
      text-align: center;
      background: rgba(0, 0, 0, 0.7);
    }

    header h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 3rem;
      letter-spacing: 2px;
      color: #ff2e63;
      text-shadow: 0 0 10px rgba(255, 46, 99, 0.5);
    }

    nav {
      margin-top: 1rem;
    }

    nav a {
      color: #08d9d6;
      margin: 0 1rem;
      text-decoration: none;
      font-weight: 600;
      transition: color 0.3s;
    }

    nav a:hover {
      color: #ff2e63;
    }

    .hero {
      height: calc(100vh - 180px);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
      background: linear-gradient(145deg, #0d0d0d, #121212);
    }

    .hero h2 {
      font-size: 2.8rem;
      max-width: 800px;
      line-height: 1.3;
      background: linear-gradient(90deg, #ff2e63, #08d9d6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: pulseText 4s infinite;
    }

    @keyframes pulseText {
      0%, 100% { letter-spacing: 1px; }
      50% { letter-spacing: 4px; }
    }

    .cta {
      margin-top: 2.5rem;
    }

    .cta-button {
      padding: 0.9rem 2.2rem;
      border: 2px solid #08d9d6;
      color: #08d9d6;
      background: transparent;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 40px;
      cursor: pointer;
      transition: all 0.4s ease;
      text-transform: uppercase;
    }

    .cta-button:hover {
      background: #08d9d6;
      color: #0a0a0a;
      transform: scale(1.05);
      box-shadow: 0 0 20px #08d9d6;
    }

    footer {
      padding: 1rem;
      text-align: center;
      background: rgba(255, 255, 255, 0.02);
      font-size: 0.9rem;
      color: #444;
    }
  </style>
</head>
<body>

  <header>
    <h1>Obsidian</h1>
  </header>

  <section class="hero">
    <div>
      <h2>Precision. Power. Presence.</h2>
      <div class="cta">
        <a href = "index1.html" class="cta-button">Enter</a>
      </div>
    </div>
  </section>

  <footer>
    &copy; 2025 Obsidian Systems. All rights reserved.
  </footer>

</body>
</html>
