<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Lumen</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500&family=Raleway:wght@300;500&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(to bottom right, #fdf6f0, #f9e3f0);
      font-family: 'Raleway', sans-serif;
      color: #4a3b47;
      line-height: 1.6;
      min-height: 100vh;
    }

    header {
      text-align: center;
      padding: 3rem 1rem;
      background: rgba(255, 255, 255, 0.6);
      backdrop-filter: blur(10px);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
    }

    header h1 {
      font-family: 'Playfair Display', serif;
      font-size: 3rem;
      color: #c96e8e;
      margin-bottom: 0.5rem;
    }

    header p {
      font-size: 1.1rem;
      color: #6e4f5c;
    }

    nav {
      margin-top: 2rem;
    }

    nav a {
      text-decoration: none;
      color: #a26a7a;
      margin: 0 1.5rem;
      font-weight: 500;
      transition: color 0.3s ease;
    }

    nav a:hover {
      color: #c96e8e;
    }

    .hero {
      text-align: center;
      padding: 5rem 2rem;
      background: linear-gradient(145deg, #fff7f7, #fbeff6);
      position: relative;
    }

    .hero h2 {
      font-size: 2.5rem;
      margin-bottom: 1.5rem;
      color: #a26a7a;
    }

    .hero p {
      font-size: 1.2rem;
      max-width: 600px;
      margin: 0 auto 2.5rem;
      color: #5c4a52;
    }

    .cta-button {
      padding: 0.9rem 2.2rem;
      background-color: #f7d6e0;
      color: #5a3b45;
      font-weight: 500;
      border: none;
      border-radius: 40px;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 14px rgba(201, 110, 142, 0.2);
    }

    .cta-button:hover {
      background-color: #f9c7d7;
      box-shadow: 0 6px 20px rgba(201, 110, 142, 0.4);
      transform: scale(1.05);
    }

    footer {
      text-align: center;
      padding: 2rem 1rem;
      font-size: 0.9rem;
      background-color: rgba(255, 255, 255, 0.4);
      color: #8a6c7c;
      margin-top: 4rem;
    }
  </style>
</head>
<body>

  <header>
    <h1>Lumen</h1>
    <p>Light within. Calm without.</p>
  </header>

  <section class="hero">
    <h2>Awaken the gentle power within you</h2>
    <p>Step into a space where softness is strength, stillness is sacred, and your presence is divine.</p>
	<a href = "index1.html" class="cta-button">Go back</a>
  </section>

  <footer>
    &copy; 2025 Lumen Sanctuary. All rights reserved with grace.
  </footer>

</body>
</html>
