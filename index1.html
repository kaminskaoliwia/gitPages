<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Unique Modern Website</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #1f1c2c, #928dab);
      color: #fff;
      line-height: 1.6;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      padding: 2rem;
      text-align: center;
      background: rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(8px);
    }

    header h1 {
      font-size: 3rem;
      color: #f8f8f8;
    }

    nav {
      margin-top: 1rem;
    }

    nav a {
      color: #ffdd57;
      margin: 0 1rem;
      text-decoration: none;
      font-weight: bold;
    }

    nav a:hover {
      text-decoration: underline;
    }

    .hero {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 4rem 2rem;
    }

    .hero h2 {
      font-size: 2.5rem;
      margin-bottom: 1rem;
    }

    .hero p {
      font-size: 1.2rem;
      max-width: 600px;
      margin: 0 auto;
    }

    .cta-button {
      margin-top: 2rem;
      padding: 0.75rem 2rem;
      background-color: #ffdd57;
      color: #1f1c2c;
      border: none;
      border-radius: 30px;
      font-size: 1rem;
      cursor: pointer;
      transition: transform 0.2s ease, background-color 0.3s ease;
    }

    .cta-button:hover {
      transform: scale(1.05);
      background-color: #ffe97f;
    }

    footer {
      text-align: center;
      padding: 1rem;
      background: rgba(0, 0, 0, 0.2);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <header>
    <h1>AI</h1>
    <nav>
      <a href="dark.html">Dark</a>
      <a href="soft.html">Soft</a>
      <a href="funny.html">Funny</a>
      <a href="funnier.html">Funnier</a>
    </nav>
  </header>

  <section class="hero">
    <div>
      <h2>Strony stworzone przez AI</h2>
      <p>Szablony stworzone przez AI po wpisaniu konkretnych słów kluczowych</p> <br>
      <a href="getting-started.html" class="cta-button">Scary</a>
    </div>
  </section>

  <footer>
    &copy; 2025. All rights reserved.
  </footer>

</body>
</html>
